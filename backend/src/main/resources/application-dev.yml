# Dev profile — local MySQL, debug logging, permissive defaults
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lesuccess_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin@123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

lesuccess:
  jwt:
    # Dev-only fallback so the app boots without setting JWT_SECRET in the environment.
    # This value must never be used in production.
    secret: ${JWT_SECRET:dev-local-insecure-secret-at-least-256-bits-long-do-not-use-in-prod!!}

  rate-limit:
    requests-per-hour: 50
    trust-proxy: false

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

logging:
  level:
    in.lesuccess.portal: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
