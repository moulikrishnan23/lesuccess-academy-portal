# Dev profile — local MySQL, debug logging, permissive defaults
spring:
  datasource:
    # createDatabaseIfNotExist: dev-only convenience so a fresh clone boots without
    # a manual CREATE DATABASE. Deliberately absent from application.yml and
    # application-prod.yml — see the note in application-prod.yml.
    url: jdbc:mysql://localhost:3306/lesuccess_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    # No defaults, deliberately — same pattern as JWT_SECRET in application.yml.
    # A literal credential here would be committed the moment this file is staged,
    # and a fallback default would let dev boot on a guessable one. Supply these
    # via a git-ignored .env or your shell; see .env.example.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

lesuccess:
  rate-limit:
    requests-per-hour: 50  # relaxed for dev testing
    trust-proxy: false

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

logging:
  level:
    in.lesuccess.portal: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
